<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AMU — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #12111a;
    --panel: #1a1926;
    --border: rgba(255,255,255,0.07);
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.1);
    --input-focus: rgba(138,100,255,0.5);
    --accent: #8a64ff;
    --accent-hover: #7a50f0;
    --text: #f0eeff;
    --muted: rgba(240,238,255,0.45);
    --link: #a78bff;
    --success: #5dd68e;
    --error: #ff6b6b;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  .page {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
  }

  /* ── LEFT PANEL ── */
  .visual {
    position: relative;
    overflow: hidden;
    background: #0d0c14;
  }

  .visual-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.75;
    transform: scale(1.05);
    transition: transform 18s ease;
    animation: slowZoom 18s ease forwards;
  }

  @keyframes slowZoom {
    from { transform: scale(1.08); }
    to   { transform: scale(1.0); }
  }

  .visual-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      135deg,
      rgba(10,8,20,0.55) 0%,
      rgba(60,30,120,0.25) 60%,
      rgba(10,8,20,0.7) 100%
    );
  }

  .visual-grain {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px;
    opacity: 0.5;
    pointer-events: none;
  }

  .logo {
    position: absolute;
    top: 32px;
    left: 36px;
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    letter-spacing: 0.12em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 4px;
    z-index: 2;
  }

  .logo span {
    display: inline-block;
    transform: scaleX(-1);
    font-style: italic;
  }

  .back-btn {
    position: absolute;
    top: 28px;
    right: 28px;
    z-index: 2;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.85);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 100px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: background 0.2s, border-color 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }

  .back-btn:hover {
    background: rgba(255,255,255,0.17);
    border-color: rgba(255,255,255,0.25);
  }

  .back-btn svg { transition: transform 0.2s; }
  .back-btn:hover svg { transform: translateX(3px); }

  .tagline {
    position: absolute;
    bottom: 44px;
    left: 36px;
    right: 36px;
    z-index: 2;
  }

  .tagline h2 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(26px, 3vw, 38px);
    line-height: 1.18;
    color: #fff;
    text-shadow: 0 2px 24px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(18px);
    animation: fadeUp 0.8s 0.4s forwards;
  }

  .tagline p {
    margin-top: 10px;
    font-size: 14px;
    color: rgba(255,255,255,0.55);
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.8s 0.65s forwards;
  }

  /* ── RIGHT PANEL ── */
  .form-side {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 56px;
    background: var(--panel);
    position: relative;
    overflow: hidden;
  }

  .form-side::before {
    content: '';
    position: absolute;
    top: -120px;
    right: -120px;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(138,100,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .form-card {
    width: 100%;
    max-width: 420px;
    opacity: 0;
    transform: translateY(24px);
    animation: fadeUp 0.75s 0.2s forwards;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 3.5vw, 42px);
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 10px;
    color: var(--text);
  }

  .signin-prompt {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .signin-prompt a {
    color: var(--link);
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s;
  }

  .signin-prompt a:hover { color: #c4adff; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
    position: relative;
  }

  .field label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 2px;
  }

  .field input {
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    width: 100%;
  }

  .field input::placeholder { color: rgba(240,238,255,0.25); }

  .field input:focus {
    border-color: var(--accent);
    background: rgba(138,100,255,0.07);
    box-shadow: 0 0 0 3px rgba(138,100,255,0.15);
  }

  .field input.error {
    border-color: var(--error);
    box-shadow: 0 0 0 3px rgba(255,107,107,0.12);
  }

  .field-error {
    font-size: 12px;
    color: var(--error);
    padding-left: 2px;
    min-height: 16px;
    display: block;
  }

  .pw-wrap { position: relative; }

  .pw-wrap input { padding-right: 44px; }

  .eye-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 4px;
    display: flex;
    align-items: center;
    transition: color 0.2s;
  }

  .eye-btn:hover { color: var(--text); }

  /* password strength */
  .strength-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-top: 8px;
  }

  .strength-bar span {
    height: 3px;
    border-radius: 99px;
    background: rgba(255,255,255,0.08);
    transition: background 0.3s;
  }

  .strength-bar[data-level="1"] span:nth-child(1) { background: var(--error); }
  .strength-bar[data-level="2"] span:nth-child(-n+2) { background: #ffb347; }
  .strength-bar[data-level="3"] span:nth-child(-n+3) { background: #7bc8f5; }
  .strength-bar[data-level="4"] span { background: var(--success); }

  .strength-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    height: 14px;
  }

  /* checkbox */
  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0 22px;
    cursor: pointer;
    user-select: none;
  }

  .check-row input[type="checkbox"] { display: none; }

  .check-box {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1.5px solid var(--input-border);
    background: var(--input-bg);
    flex-shrink: 0;
    display: grid;
    place-items: center;
    transition: background 0.2s, border-color 0.2s;
  }

  .check-box svg { opacity: 0; transform: scale(0.5); transition: opacity 0.2s, transform 0.2s; }

  .check-row input:checked ~ .check-box {
    background: var(--accent);
    border-color: var(--accent);
  }

  .check-row input:checked ~ .check-box svg { opacity: 1; transform: scale(1); }

  .check-row span { font-size: 13.5px; color: var(--muted); }
  .check-row a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }

  /* submit */
  .submit-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .submit-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
    pointer-events: none;
  }

  .submit-btn:hover:not(:disabled) {
    background: var(--accent-hover);
    box-shadow: 0 6px 28px rgba(138,100,255,0.45);
    transform: translateY(-1px);
  }

  .submit-btn:active:not(:disabled) { transform: translateY(0); }

  .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  /* divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 22px 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* social */
  .social-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 12px;
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    text-decoration: none;
  }

  .social-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.18);
    transform: translateY(-1px);
  }

  /* success state */
  .success-msg {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    padding: 20px 0;
  }

  .success-msg .check-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(93,214,142,0.15);
    border: 2px solid var(--success);
    display: grid;
    place-items: center;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .success-msg h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    color: var(--text);
  }

  .success-msg p { font-size: 14px; color: var(--muted); }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 760px) {
    .page { grid-template-columns: 1fr; }
    .visual { display: none; }
    .form-side { padding: 32px 28px; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- LEFT: Visual -->
  <aside class="visual">
    <img class="visual-img"
      src="download (3).jpg"
      alt="Desert dunes at dusk"/>
    <div class="visual-overlay"></div>
    <div class="visual-grain"></div>

    <div class="logo">Beta Tech Solutions</div>

    <a href="#" class="back-btn">
      Back to website
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div class="tagline">
      <h2>Creating Login Page,<br/>Login Page</h2>
      <p>Join Now .</p>
    </div>
  </aside>

  <!-- RIGHT: Form -->
  <main class="form-side">
    <div class="form-card">

      <h1>Create an<br/>account</h1>
      <p class="signin-prompt">Already have an account? <a href="#">Log in</a></p>

      <form id="signupForm" novalidate>

        <div class="row">
          <div class="field">
            <label>First name</label>
            <input type="text" id="firstName" placeholder="First Name" autocomplete="given-name"/>
            <span class="field-error" id="firstNameErr"></span>
          </div>
          <div class="field">
            <label>Last name</label>
            <input type="text" id="lastName" placeholder="Last Name" autocomplete="family-name"/>
            <span class="field-error" id="lastNameErr"></span>
          </div>
        </div>

        <div class="field">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
          <span class="field-error" id="emailErr"></span>
        </div>

        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password"/>
            <button type="button" class="eye-btn" id="eyeBtn" aria-label="Toggle password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="strength-bar" id="strengthBar" data-level="0">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="strength-label" id="strengthLabel"></div>
          <span class="field-error" id="passwordErr"></span>
        </div>

        <label class="check-row">
          <input type="checkbox" id="terms"/>
          <div class="check-box">
            <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
              <path d="M1 4.5L4 7.5L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span>I agree to the <a href="#" onclick="return false">Terms & Conditions</a></span>
        </label>

        <button type="submit" class="submit-btn" id="submitBtn">Create account</button>

      </form>

      <div class="success-msg" id="successMsg">
        <div class="check-circle">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
            <path d="M7 15.5L12.5 21L23 9" stroke="#5dd68e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3>Welcome aboard!</h3>
        <p>Your account has been created.<br/>Check your inbox to verify your email.</p>
      </div>

      <div class="divider">Or register with</div>

      <div class="social-row">
        <a href="#" class="social-btn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
          Google
        </a>
        <a href="#" class="social-btn">
          <svg width="17" height="17" viewBox="0 0 814 1000" fill="currentColor"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-37.4-150.1-98.5C27.9 756.7.1 670.6.1 588.2c0-194.3 127.4-297.5 252.7-297.5 66.1 0 121.2 43.4 162.6 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/></svg>
          Apple
        </a>
      </div>

    </div>
  </main>
</div>

<script>
  // ── Password toggle ──
  const pwInput = document.getElementById('password');
  const eyeBtn  = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');

  eyeBtn.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    eyeIcon.innerHTML = show
      ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
         <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
         <line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  });

  // ── Strength meter ──
  const strengthBar   = document.getElementById('strengthBar');
  const strengthLabel = document.getElementById('strengthLabel');
  const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
  const colors  = ['', 'var(--error)', '#ffb347', '#7bc8f5', 'var(--success)'];

  pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    let score = 0;
    if (v.length >= 8)  score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    strengthBar.dataset.level = v.length ? score : 0;
    strengthLabel.textContent = v.length ? labels[score] : '';
    strengthLabel.style.color = colors[score];
  });

  // ── Validation ──
  function setErr(id, msg) {
    const el = document.getElementById(id);
    if (el) el.textContent = msg;
    const input = document.getElementById(id.replace('Err', ''));
    if (input) input.classList.toggle('error', !!msg);
  }

  function clearErrors() {
    ['firstName','lastName','email','password'].forEach(f => setErr(f + 'Err', ''));
  }

  function validate() {
    let ok = true;
    const fn = document.getElementById('firstName').value.trim();
    const ln = document.getElementById('lastName').value.trim();
    const em = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    const tc = document.getElementById('terms').checked;

    clearErrors();

    if (!fn) { setErr('firstNameErr', 'Required'); ok = false; }
    if (!ln) { setErr('lastNameErr', 'Required'); ok = false; }
    if (!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { setErr('emailErr', 'Enter a valid email'); ok = false; }
    if (pw.length < 8) { setErr('passwordErr', 'Min. 8 characters'); ok = false; }
    if (!tc) {
      // flash the label
      const lbl = document.querySelector('.check-row span');
      lbl.style.color = 'var(--error)';
      setTimeout(() => lbl.style.color = '', 1500);
      ok = false;
    }
    return ok;
  }

  // ── Submit ──
  const form      = document.getElementById('signupForm');
  const submitBtn = document.getElementById('submitBtn');
  const successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!validate()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating…';

    await new Promise(r => setTimeout(r, 1400));

    form.style.display = 'none';
    successMsg.style.display = 'flex';
  });
</script>
</body>
</html>
